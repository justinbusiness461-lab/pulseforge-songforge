<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#7c6cf0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
<title>SongForge — Prompt to Score</title>
<style>
:root{--bg:#0a0c12;--s:#12161f;--s2:#1a2030;--b:#2a3348;--t:#e6ebf5;--m:#8892a8;--a:#7c6cf0;--a2:#00d2c6;--ok:#00c853;--w:#ffc107;--danger:#ff6b7a;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;padding:12px 12px calc(88px + var(--safe))}
.app{max-width:560px;margin:0 auto}
h1{font-size:1.15rem} h1 span{color:var(--a2)}
.sub{font-size:.7rem;color:var(--m);margin:.2rem 0 .85rem}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--m);margin-bottom:10px}
label{display:block;font-size:.72rem;color:var(--m);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:10px 12px;font-size:16px;min-height:44px;margin-bottom:8px}
textarea.prompt{min-height:76px;resize:vertical;line-height:1.4}
input[type=range]{min-height:auto;padding:0;accent-color:var(--a)}
button{background:var(--a);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:.9rem;min-height:48px;padding:0 14px;cursor:pointer;touch-action:manipulation}
button.secondary{background:var(--s2);color:var(--t);border:1px solid var(--b)}
button.full{width:100%}
button.sm{min-height:36px;font-size:.75rem;padding:0 10px}
.status{font-size:.78rem;padding:8px 10px;border-radius:8px;border:1px solid var(--b);background:var(--s2);margin-bottom:12px}
.status.ok{border-color:var(--ok);color:var(--ok)}
.status.warn{border-color:var(--w);color:var(--w)}
.badge{display:inline-block;font-size:.68rem;padding:4px 8px;border-radius:6px;background:var(--s2);border:1px solid var(--b);margin:0 4px 4px 0}
.badge.role{border-color:var(--a);color:var(--a2)}
.strip{background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:8px;padding:10px;margin-bottom:8px}
.strip-name{font-size:.85rem;font-weight:600;margin-bottom:6px}
.strip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.strip-row label{margin:0;font-size:.7rem}
.matrix{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:10px}
.cell{aspect-ratio:1;background:rgba(255,255,255,.06);border-radius:3px;cursor:pointer;min-height:18px}
.cell.on{background:var(--a)}
.cell.kick{background:var(--a2)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;padding:10px 12px calc(10px + var(--safe));background:rgba(10,12,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--b)}
.dock button{flex:1}
.meter{height:3px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:8px}
.meter>div{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="app">
<h1>PulseForge <span>SongForge</span></h1>
<p class="sub">Phase 1 · Prompt → Score Graph · Thumbs-first · Local only</p>
<div id="status" class="status ok">Type a prompt → Compile → Play</div>
<div class="card">
<h3>Generative prompt</h3>
<textarea id="prompt" class="prompt" placeholder="e.g. dark 102 BPM alt hip-hop, F# minor, smoky bass, sparse drums…"></textarea>
<button class="full" id="btnCompile">Compile Production Prompt</button>
</div>
<div class="card">
<h3>SongSpec metadata</h3>
<div id="meta">No SongSpec yet.</div>
<div id="sections" style="margin-top:10px"></div>
<div class="meter"><div id="prog"></div></div>
</div>
<div class="card">
<h3>Channel mixer</h3>
<div id="mixer"></div>
</div>
<div class="card">
<h3>Step matrix (16 × 1/8)</h3>
<select id="editTrack"></select>
<div id="matrix" class="matrix"></div>
</div>
<div class="card">
<h3>Export</h3>
<div class="row2">
<button class="secondary sm" id="btnSave">Save JSON</button>
<button class="secondary sm" id="btnMEG">Cinema Graph</button>
</div>
</div>
</div>
<div class="dock">
<button id="btnPlay">Play</button>
<button class="secondary" id="btnStop">Stop</button>
<button id="btnWav" style="background:var(--ok);color:#000">WAV</button>
</div>
<script src="app-core.js"></script>
<script src="app-ui.js"></script>
</body>
</html>
